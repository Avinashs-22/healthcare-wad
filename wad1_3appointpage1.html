<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
</head>
<body>

<h2 align="center">Appointment Booking</h2>

<form>
<table border="1" align="center" cellpadding="8">
    <tr><th colspan="2">Book Appointment</th></tr>

    <tr>
        <td>Patient Name</td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td>Select Doctor</td>
        <td>
            <select>
                <option>Dr. Anil Kumar</option>
                <option>Dr. Meera</option>
                <option>Dr. Ravi</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Date</td>
        <td><input type="date"></td>
    </tr>

    <tr>
        <td>Time</td>
        <td><input type="time"></td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Book Appointment">
        </td>
    </tr>
</table>
</form>

</body>
</html>
