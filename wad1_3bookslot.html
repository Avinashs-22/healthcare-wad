<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>

    <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: transparent;
        color: #2c3e50;
    }

    .page-card {
        width: 100%;
        padding: 30px 40px;
        box-sizing: border-box;
    }

    .page-card h2 {
        color: #1f618d;
        font-size: 26px;
        margin-bottom: 30px;
        position: relative;
    }

    .page-card h2::after {
        content: "";
        width: 70px;
        height: 4px;
        background: linear-gradient(90deg, #3498db, #21618c);
        display: block;
        margin-top: 10px;
        border-radius: 10px;
    }

    .form-card {
        max-width: 600px;
        background: linear-gradient(135deg, #f8fcff, #ffffff);
        padding: 28px 30px;
        border-radius: 18px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.15);
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #21618c;
    }

    input, select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #bcdffb;
        font-size: 15px;
        background: #f9fcff;
        transition: 0.3s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 10px rgba(52,152,219,0.35);
    }

    .center-btn {
        text-align: center;
        margin-top: 30px;
    }

    input[type=submit] {
        background: linear-gradient(135deg, #3498db, #21618c);
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(52,152,219,0.4);
        transition: 0.3s;
    }

    input[type=submit]:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(33,97,140,0.5);
    }
    </style>
</head>

<body>

<div class="page-card">

    <h2>Book Your Slot</h2>

    <div class="form-card">
        <form>

            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" placeholder="Enter patient name">
            </div>

            <div class="form-group">
                <label>Service Type</label>
                <select>
                    <option>AI Consultation</option>
                    <option>Doctor Visit</option>
                    <option>Physiotherapy</option>
                </select>
            </div>

            <div class="form-group">
                <label>Doctor / Specialist</label>
                <input type="text" placeholder="Doctor name">
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Time</label>
                <input type="time">
            </div>

            <div class="form-group">
                <label>Mode</label>
                <select>
                    <option>Home Visit</option>
                    <option>Online Consultation</option>
                    <option>Hospital Visit</option>
                </select>
            </div>

            <div class="center-btn">
                <input type="submit" value="Confirm Booking">
            </div>

        </form>
    </div>

</div>

</body>
</html>
