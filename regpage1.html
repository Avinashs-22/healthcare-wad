<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>

    <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #dfefff, #f9fcff);
        color: #2c3e50;
    }

    .register-page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
        box-sizing: border-box;
    }

    .register-container {
        width: 100%;
        max-width: 920px;
        background: linear-gradient(180deg, #ffffff, #f6fbff);
        padding: 45px 55px;
        border-radius: 28px;
        box-shadow:
            0 18px 45px rgba(0, 0, 0, 0.18),
            inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .register-container h2 {
        text-align: center;
        color: #1f618d;
        margin-bottom: 40px;
        font-size: 32px;
        letter-spacing: 0.4px;
        position: relative;
    }

    .register-container h2::after {
        content: "";
        width: 110px;
        height: 5px;
        background: linear-gradient(90deg, #3498db, #5dade2);
        display: block;
        margin: 16px auto 0;
        border-radius: 20px;
    }

    .form-row {
        display: flex;
        gap: 24px;
        margin-bottom: 26px;
    }

    .form-group {
        flex: 1;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #154360;
        font-size: 15px;
    }

    input[type=text],
    input[type=password],
    input[type=number] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1.5px solid #cfe5ff;
        font-size: 15px;
        background: linear-gradient(180deg, #ffffff, #f9fcff);
        transition: all 0.3s ease;
    }

    input:focus {
        outline: none;
        border-color: #3498db;
        box-shadow:
            0 0 0 4px rgba(52,152,219,0.18),
            0 8px 18px rgba(52,152,219,0.25);
    }

    .gender-group {
        margin-bottom: 26px;
    }

    .gender-group label {
        font-weight: 500;
        margin-right: 22px;
        color: #34495e;
        display: inline-block;
    }

    .category-box {
        background: linear-gradient(135deg, #eef7ff, #ffffff);
        border: 1.5px solid #cfe5ff;
        padding: 22px 24px;
        border-radius: 18px;
        box-shadow: inset 0 0 18px rgba(0,0,0,0.04);
        margin-bottom: 30px;
    }

    .category-box label {
        display: inline-flex;
        align-items: center;
        margin-right: 26px;
        margin-bottom: 14px;
        font-weight: 500;
        color: #2c3e50;
    }

    .btn-group {
        text-align: center;
        margin-top: 45px;
    }

    input[type=submit] {
        background: linear-gradient(135deg, #3498db, #21618c);
        color: white;
        border: none;
        padding: 14px 46px;
        border-radius: 34px;
        font-size: 17px;
        cursor: pointer;
        margin-right: 14px;
        box-shadow: 0 14px 35px rgba(52,152,219,0.45);
        transition: all 0.3s ease;
    }

    input[type=submit]:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 45px rgba(33,97,140,0.55);
    }

    input[type=reset] {
        background: linear-gradient(135deg, #b0bec5, #90a4ae);
        color: white;
        border: none;
        padding: 14px 38px;
        border-radius: 34px;
        font-size: 16px;
        cursor: pointer;
    }

    .login-link {
        text-align: center;
        margin-top: 30px;
        font-size: 15px;
    }

    .login-link a {
        color: #3498db;
        font-weight: 600;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }
    </style>

    <script>
        function validateForm() {
            var name = document.myForm.fullname.value;
            var email = document.myForm.email.value;
            var mobile = document.myForm.mobile.value;
            var username = document.myForm.username.value;
            var password = document.myForm.password.value;

            if (name == "") {
                alert("Please enter your full name");
                return false;
            }

            if (email == "" || email.indexOf("@") == -1) {
                alert("Please enter a valid email");
                return false;
            }

            if (mobile.length != 10 || isNaN(mobile)) {
                alert("Please enter a valid 10-digit mobile number");
                return false;
            }

            if (username == "") {
                alert("Please create a username");
                return false;
            }

            if (password == "") {
                alert("Please create a password");
                return false;
            }

            alert("Registration Successful ✅");
            return true;
        }
    </script>
</head>

<body>

<div class="register-page">
<div class="register-container">

<h2>Patient Registration</h2>

<form name="myForm" onsubmit="return validateForm()">

    <div class="form-row">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullname">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="text" name="email">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" name="mobile">
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number">
        </div>
    </div>

    <div class="form-group gender-group">
        <label>Gender</label>
        <label><input type="radio" name="gender"> Male</label>
        <label><input type="radio" name="gender"> Female</label>
        <label><input type="radio" name="gender"> Other</label>
    </div>

    <div class="form-group">
        <label>Healthcare Categories</label>
        <div class="category-box">
            <label><input type="checkbox"> General Medicine</label>
            <label><input type="checkbox"> Mental Wellness</label>
            <label><input type="checkbox"> Physiotherapy</label>
            <label><input type="checkbox"> Veterinary Care</label>
            <label><input type="checkbox"> Emergency Services</label>
            <label><input type="checkbox"> Home Care</label>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>
    </div>

    <div class="btn-group">
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </div>

</form>

<div class="login-link">
    Already Registered? <a href="wad1_3loginpage1.html">Click here to Login</a>
</div>

</div>
</div>

</body>
</html>
