<!DOCTYPE html>
<html>
<head>
    <title>AI Diagnosis</title>
</head>
<body>

<h2 align="center">AI Health Diagnosis</h2>

<form>
<table border="1" align="center" cellpadding="8">
    <tr>
        <th>Describe Your Problem</th>
    </tr>

    <tr>
        <td>
            <textarea rows="5" cols="50"
            placeholder="Type your symptoms here..."></textarea>
        </td>
    </tr>

    <tr>
        <td align="center">
            <input type="submit" value="Analyze">
        </td>
    </tr>
</table>
</form>

<br>

<table border="1" align="center" cellpadding="8">
    <tr><th>AI Result</th></tr>
    <tr>
        <td>
            Identified Issue: Sample Condition<br>
            Cause: Sample Cause<br>
            Suggested Doctor: Specialist
        </td>
    </tr>
</table>

</body>
</html>
